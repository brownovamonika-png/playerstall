<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>stall font ID — candidates vs reference</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat+Brush&family=Cookie&family=Covered+By+Your+Grace&family=Dancing+Script:wght@700&family=Great+Vibes&family=Homemade+Apple&family=Kaushan+Script&family=Marck+Script&family=Mr+Dafoe&family=Nothing+You+Could+Do&family=Pacifico&family=Parisienne&family=Permanent+Marker&family=Rock+Salt&family=Sacramento&family=Satisfy&family=Shadows+Into+Light&family=Yellowtail&family=Allura&family=Oswald:wght@700&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, sans-serif; background: #e8e8e8; padding: 24px; color: #111; }
  h1 { font-size: 18px; margin-bottom: 8px; }
  p { font-size: 13px; color: #555; margin-bottom: 20px; }
  .ref {
    background: #fff; padding: 16px; margin-bottom: 24px; border: 1px solid #ccc;
    text-align: center;
  }
  .ref img { max-width: 640px; width: 100%; height: auto; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .card {
    background: #f5f5f5; border: 1px solid #ccc; padding: 20px 24px;
    min-height: 120px; display: flex; flex-direction: column; justify-content: center;
  }
  .card .name { font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; color: #888; margin-bottom: 10px; }
  .sample {
    font-size: 64px; line-height: 1; color: #4a4a4a;
  }
  .combo {
    font-size: 48px; line-height: 1; color: #0d0d0d;
  }
  .combo .p { font-family: 'Oswald', sans-serif; font-weight: 700; letter-spacing: 0.02em; }
  .combo .s { color: #4a4a4a; margin-left: -2px; }
</style>
</head>
<body>
  <h1>Identify “stall” script font</h1>
  <p>Reference photo vs Google Font brush/script candidates. Look for dry-brush texture, long t-bar, overlap feel.</p>

  <div class="ref">
    <div class="name" style="font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#888;margin-bottom:10px;">Your reference</div>
    <img src="playerstall-dual-script-logo-reference.png" alt="reference" />
  </div>

  <div class="grid" id="grid"></div>

<script>
const fonts = [
  'Yellowtail',
  'Homemade Apple',
  'Mr Dafoe',
  'Pacifico',
  'Satisfy',
  'Kaushan Script',
  'Cookie',
  'Sacramento',
  'Parisienne',
  'Marck Script',
  'Caveat Brush',
  'Covered By Your Grace',
  'Rock Salt',
  'Nothing You Could Do',
  'Shadows Into Light',
  'Permanent Marker',
  'Dancing Script',
  'Great Vibes',
  'Allura',
];
const grid = document.getElementById('grid');
for (const f of fonts) {
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `
    <div class="name">${f}</div>
    <div class="combo"><span class="p">PLAYER</span><span class="s" style="font-family:'${f}', cursive">stall</span></div>
    <div class="sample" style="font-family:'${f}', cursive; margin-top:12px;">stall</div>
  `;
  grid.appendChild(card);
}
</script>
</body>
</html>
